<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>ΛXØNS</title><link rel="stylesheet" href="./vendor/bootstrap.min.css"><link rel="stylesheet" href="./style.css">
  
  
  
  
  </link>
  
  
  
  
</head>
<body>



<div class="text-secondary px-4 above">
  <div class="py-5 text-light">
    <div class="container">
      <div class="row">
        <!-- As a heading -->
        <nav class="navbar navbar-expand-lg navbar-dark">
          <a class="text-light navbar-brand" href="#">
            ΛXØNS
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item active">
                <a class="nav-link" href="./"><b>Auction</b></a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./vote">Voting</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./results">Results</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./faq">FAQ</a>
              </li>
            </ul>
          </div>
          <div id="prepare">
            <button class="btn btn-outline-light btn-md px-4" id="connect" type="button">
              Connect wallet
            </button>
          </div>
          <div id="connected" style="display: none;">
            <button class="btn btn-outline-light btn-md px-4" id="claim" type="button" style="display:none;">
              Claim <span id="unclaimed-amount"></span> votes
            </button>
            <button class="btn btn-outline-light btn-md px-4" id="disconnect" type="button">
              <span id="token-amount"></span> $AXON
            </button>
            <br />
          </div>
        </nav>
        
      </div>
      <br />
      <div class="row">
        <div id="main-col" class="col">
          <h1 class="mb-4 text-light"><span id="minted" class="mb-4 text-light">Loading...</span></h1>
          <div id="clockdiv" class="fs-5 mb-4 text-light">
            <span class="hours"></span>
            <span class="minutes"></span>
            <span class="seconds"></span>
          </div>
          <p class="fs-5 mb-4 text-light"><span id="currentbid"></span></p>
          <p class="fs-5 mb-4 text-light"><span id="auction"></span></p>
          <div id="connected2" style="display:none">
            <div id="connected-bid" style="display: none">
              <form>
                <div class="row">
                  <div class="col">
                    <input class="form-control form-control-lg" type="text" placeholder="" id="bid-amount" aria-label="Bid amount in AXON" inputmode="decimal">
                  </div>
                </div>
                <br />
                <div class="row">
                  <div class="col">
                    <button class="btn btn-outline-light btn-lg px-4" id="btn-bid" style="width:100%;" type="button">
                      Bid in $AXON
                    </button>
                  </div>
                </div>
              </form>
            </div>
            <div id="connected-settle" style="display: none">
              <form>
                <div class="row">
                  <div class="col">
                    <button class="btn btn-outline-light btn-lg px-4" id="btn-settle" type="button">
                      Settle auction
                    </button>
                  </div>
                </div>
              </form>
            </div>
            <br />
          </div>
        </div>
        <div id="axonframe" class="col-md-9" style="text-align:right;">
          <div style="position:relative;padding-bottom:100%;max-width:1000px;max-height:1000px;margin-left: auto;">
            <div class="artwork" style="width:100%;height:100%;position:absolute;left:0px;top:0px;max-width:1000px;max-height:1000px;" id="mostrecent" aria-label="Current Axons artwork"></div>
          </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="templates" style="display: none">
  <template id="template-balance">
    <tr>
      <th class="address"></th>
      <td class="balance"></td>
    </tr>
  </template>
  <template id="transaction">
    <div class="tex">
    </div>
  </template>
</div>










<script src="./vendor/bootstrap.bundle.min.js"></script><script src="./vendor/p5.min.js"></script><script type="module" src="./app.js"></script></body>
</html>
